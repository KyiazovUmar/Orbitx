<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT-X // KERNEL_TRACKER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-logo">
                    <div class="pulse-dot"></div>
                </div>
                <div class="brand-text">
                    <h1>ORBIT<span class="accent">X</span></h1>
                    <p class="version">SYS_BUILD_v2.4</p>
                </div>
            </div>

            <div class="panel-section">
                <h3>Parameters</h3>
                <div class="control-group">
                    <label for="objectSelect">Vector Source</label>
                    <select id="objectSelect">
                        <option value="apophis">99942 Apophis (NEO)</option>
                        <option value="iss">International Space Station</option>
                        <option value="hubble">Hubble Space Telescope</option>
                        <option value="geosync">Starlink-X (Geosync)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="speedSlider">Delta T: <span id="speedVal">1.0</span>x</label>
                    <input type="range" id="speedSlider" min="0.1" max="5.0" step="0.1" value="1.0">
                </div>

                <div class="button-grid">
                    <button id="btnPause" class="btn secondary">Halt</button>
                    <button id="btnReset" class="btn outline">Recenter</button>
                </div>
            </div>

            <div class="panel-section telemetry">
                <h3>Telemetry</h3>
                <div class="telemetry-grid">
                    <div class="metric-card">
                        <span class="metric-label">Alt</span>
                        <span class="metric-value" id="telemetryAlt">--</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Vel</span>
                        <span class="metric-value" id="telemetryVel">--</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Period</span>
                        <span class="metric-value" id="telemetryPeriod">--</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Ecc</span>
                        <span class="metric-value" id="telemetryEcc">--</span>
                    </div>
                </div>
            </div>

            <div class="panel-section terminal-log">
                <h3>Console</h3>
                <div id="terminalOutput" class="terminal-box">
                    <p class="log-info">[INIT] Establishing canvas buffer...</p>
                    <p class="log-info">[LOAD] Ephemeris arrays loaded.</p>
                    <p class="log-success">[OK] Mainloop executing.</p>
                </div>
            </div>
        </aside>

        <main class="viewport">
            <header class="top-nav">
                <div class="status-badge">
                    <span class="status-dot"></span> FEED_ACTIVE
                </div>
                <div class="nav-actions">
                    <button id="btnToggleVectors" class="chip active">Vectors</button>
                    <button id="btnToggleGrid" class="chip active">Grid</button>
                    <button id="btnFullscreen" class="chip">Expand</button>
                </div>
            </header>

            <div class="canvas-wrapper">
                <canvas id="orbitCanvas"></canvas>
                <div class="canvas-overlay-ui">
                    <div class="coordinate-readout">
                        X: <span id="posx">0.00</span> // Y: <span id="posy">0.00</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
